x-app-environment: &app-environment
  DATABASE_URL: 'postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-job_tracker}?schema=public'
  JWT_SECRET: '${JWT_SECRET:?Set JWT_SECRET in .env to a private value of at least 32 characters}'
  NODE_ENV: production
  PORT: '3000'
  FRONTEND_ORIGIN: 'http://localhost:5173'
  DEFAULT_FOLLOW_UP_DAYS: '${DEFAULT_FOLLOW_UP_DAYS:-7}'
  DIGEST_CRON: '${DIGEST_CRON:-0 9 * * 1}'
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
  SMTP_SECURE: 'false'
  SMTP_USER: ''
  SMTP_PASSWORD: ''
  SMTP_FROM: '${SMTP_FROM:-digest@example.com}'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: '${POSTGRES_USER:-postgres}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}'
      POSTGRES_DB: '${POSTGRES_DB:-job_tracker}'
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: .
      target: migrator
    restart: 'no'
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment: *app-environment
    ports:
      - '${API_HOST_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

volumes:
  postgres-data:
